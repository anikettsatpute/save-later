<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p.url { font-size: 12px; color: #555; word-break: break-all; margin: 0 0 10px; }
    textarea { width: 100%; box-sizing: border-box; height: 64px; padding: 8px;
      border: 1px solid #ccc; border-radius: 8px; font: inherit; resize: vertical; }
    button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px;
      background: #4F46E5; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #4338CA; }
    .hint { font-size: 11px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Save to Save Later</h1>
  <p class="url" id="url">…</p>
  <textarea id="note" placeholder="Note / custom title (optional)"></textarea>
  <button id="save">Save this tab</button>
  <div class="hint">Opens Save Later with this link pre-filled. AI categorizes it there.</div>
  <script src="popup.js"></script>
</body>
</html>
